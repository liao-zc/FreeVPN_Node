name: Update public subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch and build subscriptions
        run: python collector.py
      - name: Publish changed files
        run: |
          git add subscriptions README.md
          if git diff --cached --quiet -- subscriptions README.md; then
            echo "No subscription changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public subscriptions"
          git push
      - name: Purge subscription CDN caches
        continue-on-error: true
        run: |
          for path in subscriptions/v2ray.txt subscriptions/clash.yaml subscriptions/ss-ssr.txt; do
            echo "Purging $path"
            curl --fail --silent --show-error --retry 2 --retry-delay 2 \
              "https://purge.jsdelivr.net/gh/liao-zc/FreeVPN_Node@main/$path"
            echo
          done
