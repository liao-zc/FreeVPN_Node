name: Update public subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Mihomo for real tunnel speed tests
        shell: bash
        run: |
          version=1.19.33
          archive="mihomo-linux-amd64-compatible-v${version}.gz"
          curl --fail --silent --show-error --location "https://github.com/MetaCubeX/mihomo/releases/download/v${version}/${archive}" --output "/tmp/${archive}"
          gzip -dc "/tmp/${archive}" > /tmp/mihomo
          binary=/tmp/mihomo
          chmod +x "$binary"
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"
          "$binary" version
      - name: Fetch and build subscriptions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python collector.py
      - name: Publish changed files
        run: |
          git add subscriptions README.md
          if git diff --cached --quiet -- subscriptions README.md; then
            echo "No subscription changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public subscriptions"
          git push
      - name: Purge jsDelivr cache
        if: success()
        run: |
          for path in selected.txt all.txt v2ray.txt ss-ssr.txt clash.yaml vmess.txt vless.txt ss.txt ssr.txt socks.txt http.txt trojan.txt wireguard.txt hysteria2.txt; do
            curl --fail --silent --show-error "https://purge.jsdelivr.net/gh/liao-zc/FreeVPN_Node@main/subscriptions/$path" || true
          done
